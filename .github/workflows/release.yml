# Builds the Mac and Windows apps.
#
# Push a tag such as v0.2.0 (matching the version in Cargo.toml) and this
# builds both apps and publishes them as a GitHub release. The files keep the
# same names every time, so these links always fetch the newest version:
#
#   https://github.com/timhanley/end-grain-calc/releases/latest/download/End-Grain-Calc-mac.dmg
#   https://github.com/timhanley/end-grain-calc/releases/latest/download/End-Grain-Calc-windows.exe
#
# Run it by hand from the Actions tab to build both apps without publishing
# them; they are kept with the run for a week.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: never

jobs:
  mac:
    name: Mac app
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - name: Add both Mac processors to Rust
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Run the tests
        run: cargo test --release

      - name: Build the app for Apple silicon and Intel, and the disk image
        run: ./scripts/bundle-mac.sh --universal --dmg

      - name: Check the app
        run: |
          app="dist/End Grain Calc.app"
          lipo -archs "$app/Contents/MacOS/endgrain"
          lipo -archs "$app/Contents/MacOS/endgrain" | grep -q x86_64
          lipo -archs "$app/Contents/MacOS/endgrain" | grep -q arm64
          codesign --verify --deep --strict "$app"

      - name: Start the app and see it calculate a board
        continue-on-error: true
        run: |
          "dist/End Grain Calc.app/Contents/MacOS/endgrain" --trace --data "$RUNNER_TEMP/egc" > "$RUNNER_TEMP/trace.log" 2>&1 &
          sleep 20
          kill $! 2>/dev/null || true
          cat "$RUNNER_TEMP/trace.log"
          grep -q "POST /api/calc -> 200" "$RUNNER_TEMP/trace.log"

      - uses: actions/upload-artifact@v7
        with:
          name: mac
          path: dist/End-Grain-Calc-mac.dmg
          retention-days: 7
          if-no-files-found: error

  windows:
    name: Windows app
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Run the tests
        run: cargo test --release

      - name: Build the app
        run: cargo build --release

      - name: Name it for download
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target\release\endgrain.exe dist\End-Grain-Calc-windows.exe
          (Get-Item dist\End-Grain-Calc-windows.exe).VersionInfo | Format-List ProductName, FileDescription, FileVersion

      - name: Start the app and see it stay open
        continue-on-error: true
        shell: pwsh
        run: |
          $log = "$env:RUNNER_TEMP\trace.log"
          $app = Start-Process -FilePath dist\End-Grain-Calc-windows.exe `
            -ArgumentList '--trace', '--data', "$env:RUNNER_TEMP\egc" `
            -RedirectStandardError $log -PassThru
          Start-Sleep -Seconds 20
          $crashed = $app.HasExited
          if (-not $crashed) { Stop-Process -Id $app.Id -Force }
          Get-Content $log -ErrorAction SilentlyContinue
          Get-ChildItem "$env:LOCALAPPDATA\End Grain Calc" -ErrorAction SilentlyContinue | Select-Object -ExpandProperty FullName
          if ($crashed) { Write-Error "The app closed by itself, exit code $($app.ExitCode)"; exit 1 }

      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: dist/End-Grain-Calc-windows.exe
          retention-days: 7
          if-no-files-found: error

  publish:
    name: Publish the release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [mac, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check the tag matches the version in Cargo.toml
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          if [ "$tag" != "$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match version $version in Cargo.toml"
            exit 1
          fi

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Write the release notes
        run: |
          # What's new comes from the tag's own message; the rest is the same
          # every time.
          git fetch --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          {
            echo "## What's new"
            echo
            git for-each-ref "refs/tags/$GITHUB_REF_NAME" --format='%(contents:body)'
            echo
            cat .github/release-notes.md
          } > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "End Grain Calc ${GITHUB_REF_NAME#v}" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --latest \
            dist/End-Grain-Calc-mac.dmg \
            dist/End-Grain-Calc-windows.exe
